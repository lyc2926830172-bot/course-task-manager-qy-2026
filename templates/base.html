<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}学习概览{% endblock %} · 课序</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><aside class="sidebar"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">序</span><span>课序<small>课程任务管理</small></span></a><div class="nav-label">学习空间</div><nav aria-label="主导航"><a class="{{ 'selected' if active == 'dashboard' }}" href="{{ url_for('dashboard') }}"><span aria-hidden="true">◫</span> 学习概览</a><a class="{{ 'selected' if active == 'tasks' }}" href="{{ url_for('task_list') }}"><span aria-hidden="true">☷</span> 全部任务</a><a class="{{ 'selected' if active == 'courses' }}" href="{{ url_for('course_list') }}"><span aria-hidden="true">▤</span> 我的课程</a></nav><div class="profile"><div class="avatar">强</div><div>强蕴祺<small>2024110901</small></div></div></aside>
<div class="workspace"><header class="topbar"><span>我的学习工作台</span><span class="date">{{ display_date }}</span></header><main id="main">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>课序 · 课程任务管理系统 <span>Python 程序设计作业 3</span></footer></div><script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
